# Firebase App Hosting backend config.
# Region is set on the App Hosting backend in the Firebase Console
# (target: europe-west4). NOT in this file.
#
# Nitro auto-detects this environment via the `firebase_app_hosting` preset —
# no firebase.json needed.

runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 10
  minInstances: 0
  concurrency: 80
  timeoutSeconds: 60

env:
  # Site origin baked into prerendered HTML (canonical, og:url, og:image,
  # sitemap). Required at BUILD because every route is prerendered.
  - variable: NUXT_PUBLIC_SITE_URL
    value: https://fpwiki.cz
    availability:
      - BUILD
      - RUNTIME
  # Raise V8 heap for the Nitro server-bundle step. Default ~2 GB tips
  # over once content + prerender output crosses ~150 pages — first hit
  # was the icink ingest landing on master, which OOM'd the build with
  # `FATAL ERROR: Ineffective mark-compacts near heap limit`. Cloud Build
  # workers have 16 GB physical RAM, so 4 GB heap is safe headroom.
  - variable: NODE_OPTIONS
    value: --max-old-space-size=4096
    availability:
      - BUILD
